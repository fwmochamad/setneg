  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0 !important;
      padding: 0 !important;
      background: #f7f9fc !important;
      color: #1f2937;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
    }
    .board {
      display: none !important;
      width: 100% !important;
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    .board[data-harmonisasi-app-page].is-active {
      display: block !important;
    }
    .board iframe {
      display: block !important;
      width: 100% !important;
      max-width: none !important;
      height: 100vh;
      min-height: 480px;
      border: 0 !important;
      background: #f7f9fc !important;
      transition: height 0.15s ease-out;
    }
  </style>
</head>
<body>

  <!-- Section 0: Payung Kebijakan Investasi -->
  <section class="board is-active" id="harmonisasi-page-0" data-harmonisasi-app-page="0" aria-hidden="false">
    <iframe src="./dashboards/payung.html?v=20261019-16" title="1 · Payung Kebijakan Investasi" width="100%" loading="eager"></iframe>
  </section>

  <!-- Section 1: Peluang Investasi Daerah -->
  <section class="board" id="harmonisasi-page-1" data-harmonisasi-app-page="1" aria-hidden="true">
    <iframe src="./dashboards/peluang.html?v=20261019-16" title="2 · Peluang Investasi Daerah" width="100%" loading="lazy"></iframe>
  </section>

  <!-- Section 2: Demografi dan Mobilitas Penduduk -->
  <section class="board" id="harmonisasi-page-2" data-harmonisasi-app-page="2" aria-hidden="true">
    <iframe src="./dashboards/demografi.html?v=20261019-16" title="3 · Demografi &amp; Mobilitas Penduduk" width="100%" loading="lazy"></iframe>
  </section>

  <!-- Section 3: Kemudahan Berusaha dan Pelayanan Perizinan -->
  <section class="board" id="harmonisasi-page-3" data-harmonisasi-app-page="3" aria-hidden="true">
    <iframe src="./dashboards/perizinan.html?v=20261019-16" title="4 · Kemudahan Berusaha &amp; Pelayanan Perizinan" width="100%" loading="lazy"></iframe>
  </section>

  <!-- Section 4: Analisis Keselarasan Regulasi dan Tindak Lanjut -->
  <section class="board" id="harmonisasi-page-4" data-harmonisasi-app-page="4" aria-hidden="true">
    <iframe src="./dashboards/keselarasan.html?v=20261019-16" title="5 · Keselarasan Regulasi &amp; Tindak Lanjut" width="100%" loading="lazy"></iframe>
  </section>

  <script>
    (function() {
      var tabNames = ["payung", "peluang", "demografi", "perizinan", "keselarasan"];
      var boards = Array.from(document.querySelectorAll("section.board[data-harmonisasi-app-page]"));

      function setActive(index, updateHash) {
        if (index < 0 || index >= boards.length) index = 0;
        boards.forEach(function(item, i) {
          var active = (i === index);
          item.classList.toggle("is-active", active);
          item.setAttribute("aria-hidden", active ? "false" : "true");
          var frame = item.querySelector("iframe");
          // Lazy load if not yet loaded
          if (active && frame && frame.getAttribute("loading") === "lazy") {
            frame.setAttribute("loading", "eager");
          }
        });

        var activeFrame = boards[index].querySelector("iframe");
        if (activeFrame && activeFrame.contentWindow) {
          try {
            activeFrame.contentWindow.postMessage({ type: "harmonisasi:resize-request" }, "*");
          } catch(e) {}
        }

        if (updateHash && history.replaceState) {
          var newUrl = location.pathname + location.search + "#" + tabNames[index];
          history.replaceState(null, "", newUrl);
        }
      }

      function syncFromHash() {
        var raw = (location.hash || "").replace(/^#/, "");
        var parts = raw.split("/");
        var idx = tabNames.indexOf(parts[0].toLowerCase());
        // Deep link detail temuan: #keselarasan/T-007
        if (idx === 4 && parts[1]) {
          var frame = boards[4] && boards[4].querySelector("iframe");
          var want = "./dashboards/keselarasan.html?v=20261019-16&temuan=" + encodeURIComponent(parts[1].toUpperCase());
          if (frame && frame.getAttribute("src") !== want) frame.setAttribute("src", want);
        }
        setActive(idx < 0 ? 0 : idx, false);
      }

      // Iframe setinggi konten, jadi position:fixed di dalamnya tidak mengikuti layar.
      // Kirim posisi viewport (dalam koordinat iframe) agar pop-up bisa diletakkan di area terlihat.
      function sendViewport(frame) {
        if (!frame || !frame.contentWindow) return;
        try {
          frame.contentWindow.postMessage({
            type: "harmonisasi:viewport",
            top: Math.max(0, -frame.getBoundingClientRect().top),
            height: window.innerHeight
          }, "*");
        } catch(e) {}
      }
      function sendViewportActive() {
        var active = boards.find(function(b) { return b.classList.contains("is-active"); });
        if (active) sendViewport(active.querySelector("iframe"));
      }
      window.addEventListener("scroll", sendViewportActive, { passive: true });
      window.addEventListener("resize", sendViewportActive);

      window.addEventListener("message", function(event) {
        var data = event.data;
        if (!data || typeof data !== "object") return;

        // Find the board originating this message
        var board = boards.find(function(item) {
          var frame = item.querySelector("iframe");
          return frame && frame.contentWindow === event.source;
        });

        if (data.type === "harmonisasi:resize") {
          var height = Math.max(320, Math.min(25000, Math.ceil(Number(data.height) || 0)));
          if (board && height > 0) {
            var frame = board.querySelector("iframe");
            if (frame) frame.style.height = height + "px";
          }
          return;
        }

        if (data.type === "harmonisasi:modal") {
          // Pop-up di dalam iframe: kunci scroll halaman dan kirim area layar yang terlihat
          document.documentElement.style.overflow = data.open ? "hidden" : "";
          document.body.style.overflow = data.open ? "hidden" : "";
          if (board) sendViewport(board.querySelector("iframe"));
          return;
        }

        if (data.type === "harmonisasi:tab") {
          var index = Number(data.index);
          if (Number.isInteger(index) && index >= 0 && index < boards.length) {
            setActive(index, true);
            var target = boards[index].querySelector("iframe");
            if (data.apply && target && target.contentWindow) {
              // Halaman tujuan menerapkan filter lalu menggulir sendiri ke kartu terkait
              try { target.contentWindow.postMessage({ type: "harmonisasi:apply", apply: data.apply }, "*"); } catch(e) {}
            } else {
              window.scrollTo({ top: 0, behavior: "smooth" });
            }
          }
        }
      });

      window.addEventListener("hashchange", syncFromHash);
      document.addEventListener("DOMContentLoaded", function() {
        syncFromHash();
        boards.forEach(function(b) {
          var f = b.querySelector("iframe");
          if (f) {
            f.addEventListener("load", function() {
              try {
                f.contentWindow.postMessage({ type: "harmonisasi:resize-request" }, "*");
              } catch(e) {}
              sendViewport(f);
            });
          }
        });
      });
    })();
  </script>
</body>
</html>
